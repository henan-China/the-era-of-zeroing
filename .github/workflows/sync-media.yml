name: sync-media

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'assets/**'

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download media into assets
        continue-on-error: true
        run: python3 scripts/sync_assets.py

      - name: Rewrite html to local assets
        run: python3 scripts/rewrite_html.py

      - name: Commit assets and html
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets assets_status.json index.html
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: sync site assets [skip ci]"
            git push
          fi
