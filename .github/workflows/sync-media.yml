name: sync-media

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'assets/**'

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rewrite html (CDN refs + track numbers)
        run: python3 scripts/rewrite_html.py

      - name: Hero fix (strings anchor + entrance timing)
        run: python3 scripts/hero_fix.py

      - name: Commit html
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: rewrite site html [skip ci]"
            git push
          fi
